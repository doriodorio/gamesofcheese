<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef's Cheese Fridge Escape</title>

<style>
    body {
        margin: 0;
        background: #2c3e50;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial;
    }

    .game-container {
        text-align: center;
    }

    h1 {
        color: white;
    }

    canvas {
        background: #ecf0f1;
        border: 4px solid #34495e;
    }

    .controls {
        color: white;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="game-container">
    <h1>Chef's Cheese Fridge Escape</h1>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="controls">
        WASD = Move | E = Pick up / Drop Cheese
    </div>
</div>

<script>

class Game {

    constructor() {

        this.canvas = document.getElementById("gameCanvas");
        this.ctx = this.canvas.getContext("2d");

        this.width = this.canvas.width;
        this.height = this.canvas.height;

        this.keys = {};
        this.ePressed = false;

        // =========================
        // PLAYER
        // =========================

        this.chef = {
            x: 50,
            y: 50,
            width: 50,
            height: 65,
            speed: 4
        };

        // =========================
        // CHEESE
        // =========================

        this.cheese = {
            x: 120,
            y: 70,
            width: 30,
            height: 30,
            isCarried: false
        };

        // =========================
        // WALLS
        // Doors are actual gaps now
        // =========================

        this.walls = [

            // Borders
            {x:0, y:0, width:800, height:20},
            {x:0, y:580, width:800, height:20},
            {x:0, y:0, width:20, height:600},
            {x:780, y:0, width:20, height:600},

            // Vertical wall with door gap
{x:300, y:0, width:20, height:40},
{x:300, y:120, width:20, height:30},

            // Horizontal wall with door gap
            {x:0, y:150, width:650, height:20},
            {x:700, y:150, width:110, height:20},

            // Vertical wall with door gap
            {x:400, y:170, width:20, height:80},
            {x:400, y:290, width:20, height:60},

            // Horizontal wall with door gap
            {x:0, y:350, width:200, height:20},
            {x:240, y:350, width:560, height:20},

            // Vertical wall with door gap
            {x:600, y:370, width:20, height:80},
            {x:600, y:490, width:20, height:90}
        ];

        // =========================
        // DOORS (visual only)
        // =========================

this.doors = [

    {x:300, y:40, width:20, height:80},

    {x:620, y:150, width:80, height:20},

    {x:400, y:220, width:20, height:80},

    {x:170, y:350, width:80, height:20},

    {x:600, y:420, width:20, height:80}
];

        // =========================
        // LASERS
        // =========================

        this.lasers = [

    {
        startX: 150,
        startY: 20,
        endX: 150,
        endY: 150,
        direction: "vertical"
    },

    {
        startX: 500,
        startY: 20,
        endX: 500,
        endY: 150,
        direction: "vertical"
    },

    {
        startX: 250,
        startY: 170,
        endX: 250,
        endY: 350,
        direction: "vertical"
    },

    {
        startX: 650,
        startY: 170,
        endX: 650,
        endY: 350,
        direction: "vertical"
    },

    {
        startX: 350,
        startY: 370,
        endX: 350,
        endY: 580,
        direction: "vertical"
    },

    {
        startX: 550,
        startY: 370,
        endX: 550,
        endY: 580,
        direction: "vertical"
    }
];

        this.setupEvents();

        this.gameLoop();
    }

    // =====================================
    // INPUT
    // =====================================

    setupEvents() {

        document.addEventListener("keydown", (e) => {
            this.keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener("keyup", (e) => {
            this.keys[e.key.toLowerCase()] = false;
        });
    }

    // =====================================
    // COLLISION
    // =====================================

    rectCollision(a, b) {

        return (
            a.x < b.x + b.width &&
            a.x + a.width > b.x &&
            a.y < b.y + b.height &&
            a.y + a.height > b.y
        );
    }

    lineIntersectsRect(laser, rect) {

        if (laser.direction === "horizontal") {

            return (
                rect.y < laser.startY &&
                rect.y + rect.height > laser.startY &&
                rect.x < laser.endX &&
                rect.x + rect.width > laser.startX
            );

        } else {

            return (
                rect.x < laser.startX &&
                rect.x + rect.width > laser.startX &&
                rect.y < laser.endY &&
                rect.y + rect.height > laser.startY
            );
        }
    }

    // =====================================
    // UPDATE
    // =====================================

    update() {

        let oldX = this.chef.x;
        let oldY = this.chef.y;

        // Movement

        if (this.keys["w"]) this.chef.y -= this.chef.speed;
        if (this.keys["s"]) this.chef.y += this.chef.speed;
        if (this.keys["a"]) this.chef.x -= this.chef.speed;
        if (this.keys["d"]) this.chef.x += this.chef.speed;

        // Wall collision

        for (let wall of this.walls) {

            if (this.rectCollision(this.chef, wall)) {

                this.chef.x = oldX;
                this.chef.y = oldY;
            }
        }

        // Pick up / drop cheese

        if (this.keys["e"] && !this.ePressed) {

            this.ePressed = true;

            const touchingCheese =
                this.rectCollision(this.chef, this.cheese);

            if (touchingCheese || this.cheese.isCarried) {

                this.cheese.isCarried =
                    !this.cheese.isCarried;
            }
        }

        if (!this.keys["e"]) {
            this.ePressed = false;
        }

        // Carry cheese

        if (this.cheese.isCarried) {

            this.cheese.x = this.chef.x + 40;
            this.cheese.y = this.chef.y + 15;
        }

        // Laser collision

        for (let laser of this.lasers) {

            let blocked = false;

            if (!this.cheese.isCarried) {

                blocked =
                    this.lineIntersectsRect(
                        laser,
                        this.cheese
                    );
            }

           if (
    !blocked &&
    this.lineIntersectsRect(
        laser,
        this.chef
    )
) {

    // Reset chef
    this.chef.x = 50;
    this.chef.y = 50;

    // Reset cheese
    this.cheese.x = 120;
    this.cheese.y = 70;

    this.cheese.isCarried = false;
}
        }
    }

    // =====================================
    // DRAW
    // =====================================

    drawWalls() {

        this.ctx.fillStyle = "#34495e";

        for (let wall of this.walls) {

            this.ctx.fillRect(
                wall.x,
                wall.y,
                wall.width,
                wall.height
            );
        }
    }

    drawDoors() {

        this.ctx.fillStyle = "#b5651d";

        for (let door of this.doors) {

            this.ctx.fillRect(
                door.x,
                door.y,
                door.width,
                door.height
            );
        }
    }

    drawLasers() {

        this.ctx.strokeStyle = "red";
        this.ctx.lineWidth = 4;

        for (let laser of this.lasers) {

            let blocked =
                this.lineIntersectsRect(
                    laser,
                    this.cheese
                );

            this.ctx.beginPath();

            if (
                blocked &&
                !this.cheese.isCarried
            ) {

                if (
                    laser.direction === "horizontal"
                ) {

                    this.ctx.moveTo(
                        laser.startX,
                        laser.startY
                    );

                    this.ctx.lineTo(
                        this.cheese.x,
                        laser.startY
                    );

                } else {

                    this.ctx.moveTo(
                        laser.startX,
                        laser.startY
                    );

                    this.ctx.lineTo(
                        laser.startX,
                        this.cheese.y
                    );
                }

            } else {

                this.ctx.moveTo(
                    laser.startX,
                    laser.startY
                );

                this.ctx.lineTo(
                    laser.endX,
                    laser.endY
                );
            }

            this.ctx.stroke();
        }
    }

    drawCheese() {

        this.ctx.fillStyle = "#FFD700";

        this.ctx.fillRect(
            this.cheese.x,
            this.cheese.y,
            this.cheese.width,
            this.cheese.height
        );

        // Holes

        this.ctx.fillStyle = "#E6B800";

        this.ctx.beginPath();
        this.ctx.arc(
            this.cheese.x + 8,
            this.cheese.y + 8,
            3,
            0,
            Math.PI * 2
        );
        this.ctx.fill();

        this.ctx.beginPath();
        this.ctx.arc(
            this.cheese.x + 18,
            this.cheese.y + 18,
            4,
            0,
            Math.PI * 2
        );
        this.ctx.fill();
    }

    drawChef() {

        const c = this.ctx;
        const chef = this.chef;

        // Body

        c.fillStyle = "white";
        c.fillRect(
            chef.x + 10,
            chef.y + 20,
            30,
            40
        );

        // Head

        c.fillStyle = "#ffdbac";

        c.beginPath();
        c.arc(
            chef.x + 25,
            chef.y + 15,
            12,
            0,
            Math.PI * 2
        );
        c.fill();

        // Hat

        c.fillStyle = "white";

        c.fillRect(
            chef.x + 15,
            chef.y,
            20,
            15
        );

        c.fillRect(
            chef.x + 20,
            chef.y - 5,
            10,
            8
        );

        // Eyes

        c.fillStyle = "black";

        c.fillRect(
            chef.x + 21,
            chef.y + 12,
            2,
            2
        );

        c.fillRect(
            chef.x + 27,
            chef.y + 12,
            2,
            2
        );

        // Arms

        c.fillStyle = "#ffdbac";

        c.fillRect(
            chef.x + 5,
            chef.y + 25,
            8,
            20
        );

        c.fillRect(
            chef.x + 37,
            chef.y + 25,
            8,
            20
        );

        // Legs

        c.fillStyle = "black";

        c.fillRect(
            chef.x + 15,
            chef.y + 50,
            8,
            15
        );

        c.fillRect(
            chef.x + 27,
            chef.y + 50,
            8,
            15
        );
    }

    draw() {

        this.ctx.clearRect(
            0,
            0,
            this.width,
            this.height
        );

        this.drawWalls();
        this.drawDoors();
        this.drawLasers();
        this.drawCheese();
        this.drawChef();
    }

    // =====================================
    // LOOP
    // =====================================

    gameLoop() {

        this.update();
        this.draw();

        requestAnimationFrame(
            () => this.gameLoop()
        );
    }
}

// START GAME

new Game();

</script>

</body>
</html>
